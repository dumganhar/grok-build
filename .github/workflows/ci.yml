# Daily CI: verify the main binary still builds on every push / PR.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows is best-effort (see README); keep it non-blocking via continue-on-error
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        # Keep in sync with rust-toolchain.toml channel.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.target }}
          cache-on-failure: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config

      - name: Check
        run: cargo check -p xai-grok-pager-bin --locked

      - name: Build
        run: cargo build -p xai-grok-pager-bin --locked

      - name: Clippy
        run: cargo clippy -p xai-grok-pager-bin --locked

      - name: Smoke-test binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="target/debug/xai-grok-pager.exe"
          else
            BIN="target/debug/xai-grok-pager"
          fi
          # Prefer --version; fall back to --help if the binary exits non-zero
          # without a TTY (some builds gate version on full init).
          "$BIN" --version 2>/dev/null || "$BIN" --help 2>/dev/null || true
